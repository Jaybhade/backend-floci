[program:knowledge-backend]
directory=/opt/knowledge-app
command=/usr/local/bin/node dist/server.js
user=knowledgeapp
environment=NODE_ENV="production",HOME="/home/knowledgeapp"
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/knowledge-backend.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
stderr_logfile=/var/log/knowledge-backend-error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=2